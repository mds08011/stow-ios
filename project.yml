# The Xcode project is generated from this file by XcodeGen (`xcodegen generate`) and is
# never committed. A hand-edited .xcodeproj cannot be reviewed or maintained from a
# machine without Xcode, and this repo is written on one.
name: Stow

options:
  bundleIdPrefix: io.github.mds08011
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  StowCore:
    path: StowCore

targets:
  Stow:
    type: application
    platform: iOS
    sources:
      - Stow
    dependencies:
      - package: StowCore
    info:
      # Written by XcodeGen, outside the sources folder, and gitignored.
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Stow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Stow records your voice notes so they can be transcribed.
        # Keeps a recording running with the screen locked or another app in front.
        UIBackgroundModes:
          - audio
        # The app only talks to Groq over HTTPS, so it uses no encryption of its own.
        # Declaring that here skips the export question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mds08011.stow
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
